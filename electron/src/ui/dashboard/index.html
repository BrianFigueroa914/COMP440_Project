<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="../../../styles.css" />
</head>

<body class="dashboard-page">

  <div class="dashboard-container">

    <!-- HEADER -->
    <div class="dashboard-header">
      <div class="header">
        <div class="logo">
        </div>
        <h1 id="welcomeText">Welcome</h1>
      </div>

    </div>

    <!-- TAB BAR -->
    <div class="tab-bar">
      <button class="tab active" onclick="showTab('addRental')">Add Rental</button>
      <button class="tab" onclick="showTab('searchRentals')">Search Rentals</button>
      <button class="tab" onclick="showTab('twoFeatures')">Two Features</button>
      <button class="tab" onclick="showTab('reviews')">Add Review</button>
      <button class="tab" onclick="showTab('highRated')">Top Rated</button>
      <button class="tab" onclick="showTab('topPosters')">Top Posters</button>
      <button class="tab" onclick="showTab('poorUsers')">Poor Reviewers</button>
      <button class="tab" onclick="showTab('cleanUsers')">No Poor Reviews</button>
      <button id="logoutBtn" type="button">Logout</button>
    </div>

    <!-- ADD RENTAL -->
    <div id="addRental" class="tab-content">
      <h3>Add Rental</h3>

      <div class="form-row">
        <input id="title" placeholder="Title" />
        <input id="description" placeholder="Description" />
        <input id="feature" placeholder="Feature (wifi, kitchen...)" />
        <input id="price" placeholder="Price" />
        <button id="addRentalBtn" type="button">Add Rental</button>
      </div>
    </div>


  <!-- SEARCH RENTALS -->
  <div id="searchRentals" class="tab-content hidden">
    <h3>Search Rentals</h3>

     <div class="form-row">
      <input id="searchFeature" placeholder="Enter feature" />

      <select id="priceFilter">
        <option value="none">Sort by price</option>
        <option value="desc">Highest → Lowest</option>
        <option value="asc">Lowest → Highest</option>
      </select>
    
      <button id="searchBtn" type="button">Search</button>
      </div>

    <ul id="results"></ul>
  </div>

  <!-- TWO FEATURES -->
  <div id="twoFeatures" class="tab-content hidden">
    <h3>Search Users by Two Features</h3>

     <div class="form-row">
      <input id="featureX" placeholder="Feature X" />
      <input id="featureY" placeholder="Feature Y" />

      <button id="searchTwoBtn" type="button">Search Users</button>
    </div>
    <ul id="twoFeatureResults"></ul>
  </div>

  <!-- REVIEWS -->
  <div id="reviews" class="tab-content hidden">
    <h3>Add Review</h3>

     <div class="form-row">
      <input id="rentalId" placeholder="Rental ID" />

      <select id="rating">
        <option value="excellent">Excellent</option>
        <option value="good">Good</option>
        <option value="fair">Fair</option>
        <option value="poor">Poor</option>
      </select>
    
      <input id="comment" placeholder="Comment" />
    

      <button id="reviewBtn" type="button">Submit Review</button>
    </div>
  </div>

  <!-- HIGH RATED -->
  <div id="highRated" class="tab-content hidden">
    <h3>Top Rated Rentals</h3>
    <div class="form-row">
    <input id="hrUsername" placeholder="Enter username" />
    <button id="highRatedBtn" type="button">Search</button>
    </div>
    <ul id="hrResults"></ul>
  </div>

  <!-- TOP POSTERS -->
  <div id="topPosters" class="tab-content hidden">
    <h3>Top Posters</h3>
    <div class="form-row">
    <input id="posterDate" type="date" />
    <button id="topPostersBtn" type="button">Search</button>
    </div>
    <ul id="tpResults"></ul>
  </div>

  <!-- POOR ONLY USERS -->
  <div id="poorUsers" class="tab-content hidden">
    <h3>Users who have only reviewed "poor"</h3>
    <ul id="poorResults"></ul>
  </div>

  <!-- CLEAN USERS -->
  <div id="cleanUsers" class="tab-content hidden">
    <h3>Users With No Poor Reviews</h3>
    <ul id="cleanResults"></ul>
  </div>

  <script src="../utils/modal.js"></script>
  <script src="dashboard.js"></script>

</body>
</html>
