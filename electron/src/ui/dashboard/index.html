<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard</title>
  <link rel="stylesheet" href="../../../styles.css" />
</head>
<body class = "dashboard-page">
  <div class="dashboard-container">
    <div class="dashboard-header">
      <div class="header">
        <div class="logo">
        </div>
        <h1 id="welcomeText">Welcome </h1>
      </div>

      <div class="button-group">
        <button id="logoutBtn" type="button">Logout</button>
      </div>
    </div>

    <div class="dashboard-section">
      <h3>Add Rental</h3>

      <div class="form-row">
        <div class="input-group form-field">
          <label for="title">Title</label>
          <input id="title" placeholder="Title" />
        </div>

        <div class="input-group form-field">
          <label for="description">Description</label>
          <input id="description" placeholder="Description" />
        </div>

        <div class="input-group form-field">
          <label for="feature">Feature</label>
          <input id="feature" placeholder="Feature (wifi, kitchen...)" />
        </div>

        <div class="input-group form-field">
          <label for="price">Price</label>
          <input id="price" placeholder="Price" />
        </div>
      </div>

      <div class="button-group">
        <button id="addRentalBtn" type="button">Add Rental</button>
      </div>
    </div>

    <div class="dashboard-section">
      <h3>Search Rentals</h3>

      <div class="form-row">
        <div class="input-group form-field">
          <label for="searchFeature">Enter Feature</label>
          <input id="searchFeature" placeholder="Enter feature" />
        </div>
      </div>

      <div class="search-row">
        <div class="button-group">
          <button id="searchBtn" type="button">Search</button>
        </div>

        <select id="priceFilter">
          <option value="none">Sort by price</option>
          <option value="desc">Highest → Lowest</option>
          <option value="asc">Lowest → Highest</option>
        </select>
      </div>

      <ul id="results"></ul>
    </div>

    <div class="dashboard-section">
      <h3>Search Users by Two Features (Same Day)</h3>

      <div class="form-row">
        <div class="input-group form-field">
          <label for="featureX">Feature X</label>
          <input id="featureX" placeholder="e.g., wifi" />
        </div>

        <div class="input-group form-field">
          <label for="featureY">Feature Y</label>
          <input id="featureY" placeholder="e.g., kitchen" />
        </div>
      </div>

      <div class="button-group">
        <button id="searchTwoBtn" type="button">Search Users</button>
      </div>

      <ul id="twoFeatureResults"></ul>
    </div>

    <div class="dashboard-section">
      <h3>Add Review</h3>

      <div class="form-row">
        <div class="input-group form-field">
          <label for="rentalId">Rental ID</label>
          <input id="rentalId" placeholder="Rental ID" />
        </div>

        <div class="input-group form-field">
          <label for="rating">Rating</label>
          <select id="rating">
            <option value="excellent">Excellent</option>
            <option value="good">Good</option>
            <option value="fair">Fair</option>
            <option value="poor">Poor</option>
          </select>
        </div>

        <div class="input-group form-field">
          <label for="comment">Comment</label>
          <input id="comment" placeholder="Comment" />
        </div>
      </div>

      <div class="button-group">
        <button id="reviewBtn" type="button">Submit Review</button>
      </div>
    </div>
  </div>

  <script src="../utils/modal.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
